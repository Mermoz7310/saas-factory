# Usine sur le VPS : 3 conteneurs légers, aucun port ouvert vers internet.
# Le bot Telegram fonctionne en « long polling » (c'est lui qui appelle Telegram).
name: saas-factory

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: factory
    volumes:
      - factory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.5" }

  factory:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD}@db:5432/factory
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }

  # Sauvegarde chaque nuit à 3h, garde 14 jours.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Brussels
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%H%M)
          if [ "$$now" = "0300" ]; then
            f=/backups/factory-$$(date +%Y%m%d).sql.gz
            pg_dump -h db -U factory factory | gzip > $$f.tmp && mv $$f.tmp $$f && echo "sauvegarde OK : $$f"
            find /backups -name 'factory-*.sql.gz' -mtime +14 -delete
            sleep 61
          fi
          sleep 30
        done
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }

volumes:
  factory-db:
